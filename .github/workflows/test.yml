name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node build.mjs
      - run: npm test
      # The patch must still apply to the pinned OpenBot, and its own tests must pass with it.
      - uses: oven-sh/setup-bun@v2
      - name: Computer patch applies and its tests pass
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/CopilotKit/openbot /tmp/openbot
          git -C /tmp/openbot checkout -q "$(cat computer/OPENBOT_REF)"
          git -C /tmp/openbot apply "$PWD/computer/human-browser.patch"
          cd /tmp/openbot && bun install --frozen-lockfile >/dev/null
          cd agent-computer && bun install --frozen-lockfile >/dev/null
          bunx tsc --noEmit -p . && bun test tests/runtime-upstream.test.ts tests/live-page.test.ts tests/private-network.test.ts
