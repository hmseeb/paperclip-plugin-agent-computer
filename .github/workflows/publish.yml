# Publishes to npm when a version tag (v0.7.0, ...) is pushed, with npm trusted publishing:
# npm trusts this workflow by its GitHub identity, so there is no token, and each release
# carries provenance linking it to the commit.
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json and the manifest
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          grep -q "version: \"${GITHUB_REF_NAME#v}\"" src/manifest.ts
      - run: npm ci
      # The first release went out by hand (npm only trusts a workflow for a package that exists).
      - name: Publish, unless this version is on npm already
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then echo "already published"; else npm publish --access public --provenance; fi
